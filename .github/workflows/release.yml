name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Get Version Tag
        id: vars
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ steps.vars.outputs.tag }}"
          BINARY_NAME="tboard"
          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then
            EXT=".exe"
          fi

          DIST_DIR="dist/tboard_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p "$DIST_DIR"

          go build -ldflags="-s -w -X main.version=${VERSION}" -o "$DIST_DIR/${BINARY_NAME}${EXT}" ./cmd/tboard
          cp README.md LICENSE "$DIST_DIR/" 2>/dev/null || cp README.md "$DIST_DIR/"

          cd dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip -r "tboard_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}.zip" "tboard_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}"
          else
            tar -czvf "tboard_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz" "tboard_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: archives-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz dist/*.zip

  publish-release:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: archives-*
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
